<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beranda - Kagemusha</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="kanji">影武者</div>
      <h1>Kagemusha</h1>
    </div>

    <div class="card-panel slide-up-in" id="profileCard" style="animation-delay:0.05s;">
      <p style="margin:0; font-size:14px; color:var(--ink-soft);">Selamat datang,</p>
      <h2 id="playerName" style="margin:2px 0 0;">...</h2>
    </div>

    <div class="card-panel slide-up-in" style="animation-delay:0.15s;">
      <h3>Buat room baru</h3>
      <label for="roomName">Nama room</label>
      <input type="text" id="roomName" placeholder="Room-nya siapa?" maxlength="24" />

      <label for="roomVisibility">Tipe room</label>
      <select id="roomVisibility">
        <option value="public">Publik (siapa saja bisa lihat & join)</option>
        <option value="private">Privat (hanya lewat kode)</option>
      </select>

      <button id="createBtn">Buat room</button>
      <div class="error-msg" id="createError"></div>
    </div>

    <div class="card-panel slide-up-in" style="animation-delay:0.25s;">
      <h3>Gabung pakai kode</h3>
      <label for="joinCode">Kode room</label>
      <input type="text" id="joinCode" placeholder="Contoh: KGM482" maxlength="8" style="text-transform:uppercase;" />
      <button id="joinBtn" class="btn-gold">Gabung room</button>
      <div class="error-msg" id="joinError"></div>
    </div>

    <div class="card-panel slide-up-in" style="animation-delay:0.35s;">
      <h3>Room publik terbuka</h3>
      <div id="publicRoomList">
        <p class="hint">Memuat daftar room...</p>
      </div>
    </div>

    <button class="btn-secondary slide-up-in" id="logoutBtn" style="animation-delay:0.45s;">Keluar</button>
  </div>

  <script type="module">
    import {
      auth, db,
      onAuthStateChanged,
      signOut,
      doc,
      setDoc,
      getDoc,
      collection,
      query,
      where,
      getDocs,
      onSnapshot,
      serverTimestamp,
      limit,
      orderBy
    } from "./js/firebase-config.js";
    import { initPageTransition, navigateTo } from "./js/page-transition.js";
    initPageTransition();

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user || !user.emailVerified) {
        navigateTo("login.html");
        return;
      }
      currentUser = user;
      document.getElementById("playerName").textContent = user.displayName || user.email;
      loadPublicRooms();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      navigateTo("login.html");
    });

    function generateRoomCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "KGM";
      for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    document.getElementById("createBtn").addEventListener("click", async () => {
      const errEl = document.getElementById("createError");
      errEl.textContent = "";
      const name = document.getElementById("roomName").value.trim() || `Room ${currentUser.displayName}`;
      const visibility = document.getElementById("roomVisibility").value;
      const code = generateRoomCode();
      const btn = document.getElementById("createBtn");
      btn.disabled = true;
      btn.textContent = "Membuat...";

      try {
        await setDoc(doc(db, "rooms", code), {
          code,
          name,
          visibility,
          hostId: currentUser.uid,
          status: "waiting",
          players: [
            { uid: currentUser.uid, name: currentUser.displayName || currentUser.email, coins: 2, alive: true }
          ],
          turnIndex: 0,
          createdAt: serverTimestamp()
        });
        navigateTo(`room.html?code=${code}`);
      } catch (err) {
        errEl.textContent = "Gagal membuat room, coba lagi.";
        btn.disabled = false;
        btn.textContent = "Buat room";
      }
    });

    document.getElementById("joinBtn").addEventListener("click", async () => {
      const errEl = document.getElementById("joinError");
      errEl.textContent = "";
      const code = document.getElementById("joinCode").value.trim().toUpperCase();
      if (!code) {
        errEl.textContent = "Masukkan kode room dulu.";
        return;
      }
      const snap = await getDoc(doc(db, "rooms", code));
      if (!snap.exists()) {
        errEl.textContent = "Room tidak ditemukan.";
        return;
      }
      if (snap.data().status !== "waiting") {
        errEl.textContent = "Room sudah mulai atau selesai.";
        return;
      }
      navigateTo(`room.html?code=${code}`);
    });

    async function loadPublicRooms() {
      const listEl = document.getElementById("publicRoomList");
      try {
        const q = query(
          collection(db, "rooms"),
          where("visibility", "==", "public"),
          where("status", "==", "waiting"),
          limit(10)
        );
        onSnapshot(q, (snap) => {
          if (snap.empty) {
            listEl.innerHTML = '<p class="hint">Belum ada room publik yang buka. Buat sendiri, yuk!</p>';
            return;
          }
          listEl.innerHTML = "";
          snap.forEach((docSnap) => {
            const room = docSnap.data();
            const row = document.createElement("div");
            row.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);";
            row.innerHTML = `
              <div>
                <div style="font-weight:700;">${escapeHtml(room.name)}</div>
                <div class="hint" style="margin:0;">${room.players.length} pemain &middot; kode ${room.code}</div>
              </div>
            `;
            const btn = document.createElement("button");
            btn.textContent = "Gabung";
            btn.style.cssText = "width:auto; margin:0; padding:8px 14px; font-size:13px;";
            btn.addEventListener("click", () => {
              navigateTo(`room.html?code=${room.code}`);
            });
            row.appendChild(btn);
            listEl.appendChild(row);
          });
        });
      } catch (err) {
        listEl.innerHTML = '<p class="hint">Gagal memuat daftar room.</p>';
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
