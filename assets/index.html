<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kagemusha</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
  }

  .bg-wrap {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }

  .bg-wrap video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* fallback kalau video belum ada / gagal load */
  .bg-fallback {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, #3a2e46 0%, #1a1520 60%, #0d0a12 100%);
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(20,4,4,0.25) 40%, rgba(0,0,0,0.85) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 0 24px 70px;
    text-align: center;
    color: #d8cfc0;
  }

  .fog-layer {
    position: fixed;
    inset: -10%;
    pointer-events: none;
    z-index: 2;
    background:
      radial-gradient(ellipse 55% 35% at 25% 30%, rgba(200,190,180,0.05), transparent 60%),
      radial-gradient(ellipse 50% 35% at 75% 75%, rgba(122,14,14,0.10), transparent 55%);
    animation: fogDrift 20s ease-in-out infinite alternate;
  }
  @keyframes fogDrift {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(-3%, 2%) scale(1.06); }
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    box-shadow: inset 0 0 220px 60px rgba(0,0,0,0.92);
  }

  /* Scanline tipis ala VHS rusak, nambah kesan creepy */
  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.15) 0px,
      rgba(0,0,0,0.15) 1px,
      transparent 2px,
      transparent 3px
    );
    opacity: 0.5;
    mix-blend-mode: overlay;
  }

  /* Glow merah berdenyut pelan di belakang judul */
  .title-glow {
    position: absolute;
    width: 280px;
    height: 280px;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(122,14,14,0.35) 0%, transparent 70%);
    pointer-events: none;
    z-index: 1;
    animation: pulseGlow 4.5s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
    50% { opacity: 0.9; transform: translateX(-50%) scale(1.15); }
  }

  .kanji {
    font-size: 15px;
    letter-spacing: 0.35em;
    color: #8a6a28;
    margin-bottom: 6px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1s ease 0.2s forwards;
  }

  .title {
    font-family: "Shippori Mincho", "Noto Serif JP", serif;
    font-size: 46px;
    font-weight: 700;
    margin: 0 0 10px;
    letter-spacing: 0.03em;
    text-shadow: 0 0 16px rgba(122,14,14,0.5);
    opacity: 0;
    position: relative;
    animation: fadeIn 1s ease 0.4s forwards, flicker 6s ease-in-out 1.4s infinite, creepyGlitch 9s ease-in-out 2s infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.7; }
    94% { opacity: 1; }
    96% { opacity: 0.82; }
    97% { opacity: 1; }
  }

  @keyframes creepyGlitch {
    0%, 96%, 100% {
      transform: translate(0, 0);
      text-shadow: 0 0 16px rgba(122,14,14,0.5);
    }
    96.5% {
      transform: translate(-2px, 1px);
      text-shadow: 2px 0 rgba(150,0,0,0.7), -2px 0 rgba(0,150,150,0.4);
    }
    97% {
      transform: translate(2px, -1px);
      text-shadow: -2px 0 rgba(150,0,0,0.7), 2px 0 rgba(0,150,150,0.4);
    }
    97.5% {
      transform: translate(0, 0);
      text-shadow: 0 0 16px rgba(122,14,14,0.5);
    }
  }

  .bg-wrap video {
    animation: breathZoom 14s ease-in-out infinite;
  }
  @keyframes breathZoom {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .tagline {
    font-size: 14px;
    color: #9c8f80;
    margin: 0 0 30px;
    letter-spacing: 0.05em;
    opacity: 0;
    animation: fadeIn 1s ease 0.6s forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .start-btn {
    display: inline-block;
    padding: 14px 54px;
    border-radius: 999px;
    border: 1.5px solid #7a0e0e;
    background: rgba(20,4,4,0.5);
    color: #d8cfc0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-decoration: none;
    cursor: pointer;
    opacity: 0;
    animation: fadeIn 1s ease 0.8s forwards;
    transition: background 0.2s ease, transform 0.1s ease;
    box-shadow: 0 0 20px rgba(122,14,14,0.35);
  }
  .start-btn:active { transform: scale(0.96); }
  .start-btn:hover { background: rgba(122,14,14,0.25); }

  .mute-toggle {
    position: fixed;
    top: 18px; right: 18px;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.25);
    color: #f2e9d8;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    cursor: pointer;
    z-index: 5;
  }
</style>
</head>
<body>

  <div class="bg-wrap">
    <!-- Taruh file video looping kamu di assets/intro.mp4 -->
    <video id="bgVideo" autoplay muted loop playsinline>
      <source src="assets/intro.mp4" type="video/mp4" />
    </video>
  </div>

  <div class="bg-fallback" id="bgFallback"></div>

  <div class="fog-layer"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <button class="mute-toggle" id="muteToggle" title="Suara">🔇</button>

  <div class="overlay">
    <div class="title-glow"></div>
    <div class="kanji">影武者</div>
    <h1 class="title">Kagemusha</h1>
    <p class="tagline">Ia tahu siapa yang berbohong malam ini...</p>
    <a href="login.html" class="start-btn" id="startBtn">MULAI</a>
  </div>

  <script type="module">
    import { initPageTransition, navigateTo } from "./js/page-transition.js";
    initPageTransition();

    document.getElementById("startBtn").addEventListener("click", (e) => {
      e.preventDefault();
      navigateTo("login.html");
    });
  </script>

  <script type="module">
    const video = document.getElementById("bgVideo");
    const fallback = document.getElementById("bgFallback");
    const muteToggle = document.getElementById("muteToggle");

    video.addEventListener("error", () => {
      video.style.display = "none";
      fallback.style.display = "flex";
    });

    let muted = true;
    muteToggle.addEventListener("click", () => {
      muted = !muted;
      video.muted = muted;
      muteToggle.textContent = muted ? "🔇" : "🔊";
    });
  </script>
</body>
</html>
